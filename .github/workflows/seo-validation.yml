name: ANSTAT SEO & Discovery Validation

on:
  push:
    branches:
      - seo/anstat-seo-geo-aeo
      - redesign/anstat-white-green-service-site
  pull_request:
    branches:
      - main
      - redesign/anstat-white-green-service-site

jobs:
  validate-seo:
    name: Build & Validate SEO Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build, Prerender & Validate SEO
        run: npm run build
